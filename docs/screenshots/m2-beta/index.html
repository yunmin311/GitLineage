<h1>M2 Beta：候选层与真实 API partial 实验</h1>
<p>浏览器截图来自 Chromium。手机视口采用触摸模拟。真实 GitHub 实验只完成搜索、固定目录、文件选择和 partial Sidecar 下载；源码读取期间遇到匿名 Core 限额，没有产生真实比较分数。收据与浏览器状态见 <a href="../../experiments/m2-beta/validation.json">validation.json</a> 和 <a href="../../experiments/m2-beta/live/receipt.json">live receipt</a>。</p>
