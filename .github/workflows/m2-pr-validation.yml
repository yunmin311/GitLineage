name: M2 PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm64-node24:
    name: ARM64 Node 24 · offline and browser acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify native ARM64 and Node 24
        run: |
          test "$(uname -m)" = "aarch64"
          node -e 'if (process.versions.node.split(".")[0] !== "24" || process.arch !== "arm64") process.exit(1); console.log(process.version, process.arch)'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Offline Discovery tests
        run: node --test 'test/discovery/**/*.test.ts'

      - name: Discovery V3 equal-budget quality benchmark
        run: npm run benchmark:discovery

      - name: Discovery V4 fixed relevance and interpretation benchmark
        run: npm run benchmark:discovery-v4

      - name: Captured real-search candidate admission benchmark
        run: npm run benchmark:discovery-admission

      - name: Unit tests
        run: npm test

      - name: Production build
        run: |
          npm run build
          test -s dist/web/index.html
          test -s dist/web/assets/app.js

      - name: Production Deep Search remains disabled
        run: node --test test/production-preview-disabled.test.ts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Record the exact production bundle used by browser tests
        run: find dist/web -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/gitlineage-web-build.sha256"

      - name: Canvas browser acceptance
        run: npm run test:canvas

      - name: Landing browser acceptance
        run: npm run test:landing

      - name: Analysis browser acceptance
        run: npm run test:analysis

      - name: Preflight browser acceptance
        run: npm run test:preflight

      - name: Stale A to B browser acceptance
        run: npm run test:stale

      - name: UI contract browser acceptance
        run: npm run test:ui-contract

      - name: Responsive browser acceptance
        run: npm run test:responsive

      - name: Mobile browser acceptance
        run: npm run test:mobile

      - name: Relationship Map site continuity and History return
        run: npm run test:site-continuity

      - name: Deep Search and candidate layer browser acceptance
        run: npm run test:deep-search

      - name: Discovery V3 representative selection and manual review
        run: npm run test:discovery-v3-browser

      - name: Discovery V4 relevance, manual review and interpretation
        run: npm run test:discovery-v4-browser

      - name: Candidate admission, receipts and bounded failure browser acceptance
        run: npm run test:discovery-admission-browser

      - name: Anonymous repository exploration browser acceptance
        run: npm run test:exploration

      - name: Unified workspace and painted spatial routing
        run: npm run test:unification && npm run test:spatial-routing

      - name: Private Beta authorization browser acceptance
        run: npm run test:private-beta

      - name: Trusted loopback TLS and Caddy Private Beta staging
        run: npm run test:private-beta-tls
      - name: Confirm browser tests used the unchanged production bundle
        if: always()
        run: sha256sum --check "$RUNNER_TEMP/gitlineage-web-build.sha256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-browser-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
